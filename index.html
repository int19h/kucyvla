<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta
      name="description"
      content="A seeded Lojban crossword with dictionary definitions as clues."
    >
    <title>Lojban crossword — definition clues</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="definition-page">
    <main>
      <h1 class="visually-hidden">Definition-clue Lojban crossword</h1>

      <form id="options-toolbar" class="options-toolbar" novalidate>
        <section class="option-panel option-panel--puzzle" aria-labelledby="puzzle-options-title">
          <h2 id="puzzle-options-title" class="option-panel__title">Options</h2>
          <div class="option-panel__content">
            <div class="toolbar-field">
              <label class="toolbar-label" for="clue-type">Clues</label>
              <select id="clue-type" name="clueType">
                <option value="rafsi">Rafsi</option>
                <option value="definition">Definitions</option>
              </select>
            </div>

            <div class="toolbar-field toolbar-field--seed">
              <label class="toolbar-label" for="seed-input">Seed</label>
              <div class="attached-controls">
                <input id="seed-input" name="seed" type="text" spellcheck="false">
                <button id="new-seed" class="button" type="button">New seed</button>
              </div>
            </div>
          </div>
        </section>

        <section class="option-panel option-panel--words" aria-labelledby="word-selection-title">
          <h2 id="word-selection-title" class="option-panel__title">Word selection</h2>
          <div id="definition-word-selection" class="word-selection">
            <div class="toolbar-field toolbar-field--votes">
              <label class="toolbar-label" for="min-votes">Min votes</label>
              <input id="min-votes" name="minVotes" type="number" min="0" step="1" value="5">
            </div>

            <div class="toolbar-field">
              <span id="definition-types-label" class="toolbar-label">Word types</span>
              <div class="type-options" role="group" aria-labelledby="definition-types-label">
                <label><input type="checkbox" name="definitionWordType" value="gismu"> gismu</label>
                <label><input type="checkbox" name="definitionWordType" value="lujvo"> lujvo</label>
                <label><input type="checkbox" name="definitionWordType" value="cmevla"> cmevla</label>
                <label><input type="checkbox" name="definitionWordType" value="fuivla"> fu'ivla</label>
              </div>
            </div>
          </div>

          <div id="rafsi-word-selection" class="word-selection" hidden>
            <div class="toolbar-field">
              <span id="rafsi-types-label" class="toolbar-label">Word types</span>
              <div class="type-options" role="group" aria-labelledby="rafsi-types-label">
                <label><input type="checkbox" name="rafsiWordType" value="gismu" checked> gismu</label>
                <label><input type="checkbox" name="rafsiWordType" value="cmavo"> cmavo</label>
              </div>
            </div>
          </div>
        </section>

        <div class="toolbar-actions">
          <button class="button button--primary toolbar-generate" type="submit">Generate</button>
          <div class="toolbar-load">
            <div class="split-button">
              <button
                id="saved-load"
                class="button split-button__main"
                type="button"
                aria-haspopup="menu"
                aria-controls="saved-menu"
                aria-expanded="false"
              >Load</button>
              <button
                id="saved-toggle"
                class="button split-button__toggle"
                type="button"
                aria-label="Choose a saved puzzle"
                aria-haspopup="menu"
                aria-controls="saved-menu"
                aria-expanded="false"
              ><span aria-hidden="true">▾</span></button>
            </div>
            <div id="saved-menu" class="saved-menu" role="menu" hidden></div>
          </div>
        </div>
      </form>

      <section id="definition-puzzle" class="puzzle" aria-busy="true">
        <div class="puzzle__meta">
          <div class="progress-block">
            <p class="meta-label">Progress</p>
            <p id="definition-progress" class="progress">Generating…</p>
          </div>
          <div class="puzzle__actions">
            <button id="definition-check" class="button" type="button" disabled>
              Check
            </button>
            <button id="definition-clear" class="button button--quiet" type="button" disabled>
              Clear
            </button>
          </div>
        </div>

        <p id="definition-status" class="status" aria-live="polite"></p>
        <div id="definition-error" class="error" role="alert" hidden></div>

        <div class="game-layout">
          <section class="board-card" aria-labelledby="definition-board-title">
            <h2 id="definition-board-title" class="visually-hidden">Crossword grid</h2>
            <div class="board-scroll">
              <div id="definition-grid" class="grid" aria-label="Crossword grid"></div>
            </div>
            <p class="grid-note">
              Every letter, including the apostrophe, is entered normally.
              Press Enter at a crossing to change direction.
            </p>
          </section>

          <aside class="clues" aria-label="Crossword clues">
            <section class="clue-group">
              <div class="clue-group__heading">
                <h2>Across</h2>
                <span id="definition-across-count" aria-hidden="true"></span>
              </div>
              <ol id="definition-across-clues" class="clue-list"></ol>
            </section>

            <section class="clue-group">
              <div class="clue-group__heading">
                <h2>Down</h2>
                <span id="definition-down-count" aria-hidden="true"></span>
              </div>
              <ol id="definition-down-clues" class="clue-list"></ol>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script type="module" src="definition-app.js"></script>
  </body>
</html>
